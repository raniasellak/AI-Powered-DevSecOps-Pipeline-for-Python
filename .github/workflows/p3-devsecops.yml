name: P3 – DevSecOps Pipeline

on:
  push:
    branches: ["p3-invoices-history", "main"]
  pull_request:
    branches: ["main"]

jobs:
  # ------------------------------------------------------------------
  # 1. Tests de sécurité backend
  # ------------------------------------------------------------------
  tests:
    name: Tests & SAST
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r backend/requirements.txt argon2-cffi PyJWT

      - name: Run security tests (P3)
        env:
          JWT_SECRET_KEY: test-secret-key-ci
          DATABASE_URL: sqlite:///./test.db
        run: pytest backend/tests/test_invoices_security.py -v
        working-directory: .

      - name: Bandit SAST scan
        run: |
          pip install bandit
          bandit -r backend/app -ll -q

  # ------------------------------------------------------------------
  # 2. Checkov — scan IaC (Dockerfile + docker-compose)
  # ------------------------------------------------------------------
  checkov:
    name: Checkov IaC Scan
    runs-on: ubuntu-latest
    needs: tests

    steps:
      - uses: actions/checkout@v4

      - name: Run Checkov on Dockerfile
        uses: bridgecrewio/checkov-action@v12
        with:
          file: backend/Dockerfile
          framework: dockerfile
          soft_fail: true

      - name: Run Checkov on docker-compose
        uses: bridgecrewio/checkov-action@v12
        with:
          file: docker-compose.yml
          framework: docker_compose
          soft_fail: true

  # ------------------------------------------------------------------
  # 3. Build Docker image
  # ------------------------------------------------------------------
  build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [tests, checkov]

    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: docker build -t invoicepay-api:${{ github.sha }} ./backend

      - name: Start API for ZAP scan
        run: |
          docker run -d --name api \
            -e JWT_SECRET_KEY=zap-test-secret \
            -e DATABASE_URL=sqlite:///./zap.db \
            -p 8000:8000 \
            invoicepay-api:${{ github.sha }}
          sleep 8

  # ------------------------------------------------------------------
  # 4. OWASP ZAP — DAST scan
  # ------------------------------------------------------------------
  zap:
    name: OWASP ZAP DAST
    runs-on: ubuntu-latest
    needs: build

    steps:
      - uses: actions/checkout@v4

      - name: Build & start API
        run: |
          docker build -t invoicepay-api:zap ./backend
          docker run -d --name api \
            -e JWT_SECRET_KEY=zap-test-secret \
            -e DATABASE_URL=sqlite:///./zap.db \
            -p 8000:8000 \
            invoicepay-api:zap
          sleep 10

      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:8000"
          rules_file_name: ".github/zap-rules.tsv"
          fail_action: false
          artifact_name: zap-report

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-report
          path: zap_report.html

  # ------------------------------------------------------------------
  # 5. CD — Déploiement staging (après ZAP)
  # ------------------------------------------------------------------
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: zap
    if: github.ref == 'refs/heads/p3-invoices-history' || github.ref == 'refs/heads/main'

    steps:
      - uses: actions/checkout@v4

      - name: Deploy (simulation staging)
        run: |
          echo "✅ Déploiement sur staging simulé"
          echo "Image : invoicepay-api:${{ github.sha }}"
          echo "Toutes les étapes de sécurité passées : SAST, Checkov, ZAP"
          # En prod : remplacer par ssh deploy, kubectl apply, ou fly deploy
