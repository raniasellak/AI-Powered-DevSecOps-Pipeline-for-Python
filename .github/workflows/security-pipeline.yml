
name: InvoicePay DevSecOps Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-checks:
    name: Code Quality and Security
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt

      - name: Ruff - Code Quality
        run: python -m ruff check backend tests

      - name: Pytest - Automated Tests
        run: python -m pytest -v

      - name: Create reports directory
        if: always()
        run: mkdir -p reports

      - name: Bandit - Static Security Analysis
        run: |
          python -m bandit -r backend \
            -f json \
            -o reports/bandit-report.json

      - name: pip-audit - Dependency Vulnerability Scan
        run: |
          python -m pip_audit -r requirements-dev.txt \
            -f json \
            -o reports/pip-audit-report.json

      - name: Upload Security Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: invoicepay-security-reports
          path: reports/
          if-no-files-found: warn
