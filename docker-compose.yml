services:
  api:
    build:
      context: ./backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=postgresql://invoicepay:invoicepay@db:5432/invoicepay
      - JWT_SECRET_KEY=${JWT_SECRET_KEY}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: invoicepay
      POSTGRES_PASSWORD: invoicepay
      POSTGRES_DB: invoicepay
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U invoicepay"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
